<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="static/style.css">     
        <link rel="stylesheet" href="static/mainHeader.css">    
        <link rel="stylesheet" href="static/showmore.css">
        <link rel="stylesheet" href="static/bestMovies.css">
        <link rel="stylesheet" href="static/bestMovie.css">
        <link rel="stylesheet" href="static/otherGenre.css">
        <link rel="stylesheet" href="static/popup.css">
        <title>JustStreamIt</title>

        <script type="module" src="scripts/main.js"> </script>
    </head>

    <body>
        <div class="main-container">
            <header class="main-header">             
                <img class="main-header__logo" src="static/img/JSI-transparent-512.png" alt="">
                <h1 class="main-header__title"> Vidéo à la demande</h1>              
            </header>

            <main>                
                <section class="best-movie" >                  
                    <h2 class="best-movie__title">Best Movie ever :</h2>
                    <div class="best-movie__container" id="best-movie">                    
                         <div class="container__poster-container">
                            <img class="best-movie-poster" src="" alt="Movie Poster" id="best-movie-poster">
                         </div >
                         <div class="best-movie__container__details-container">
                            <h3 class="best-movie__container__details-container__h3" id="best-movie-title"></h3>
                            <p class="best-movie__container__details-container__p" id="best-movie-description"></p>
                            <button class="best-movie__container__details-container__details-button" id="best-movie-detail">Details</button>
                         </div>
                    </div>
                </section>

                <section class="movie-section">
                    <h2 class="category-best-movies-title">Best movies</h2>
                    <ul class="movies-container" id="best-movies">
                        <!-- feeded -->
                    </ul>
                    <div class="show-more-section">
                        <button class="show-more" aria-expanded="false" aria-controls="best-movies">Show more</button>
                    </div>
                </section>

                <section class="movie-section">
                    <h2 class="category-best-movies-title">Best Horror</h2>
                    <ul class="movies-container" id="best-horror-movies">
                        <!-- feeded -->
                    </ul>
                    <div class="show-more-section">
                        <button class="show-more" aria-expanded="false" aria-controls="best-horror-movies">Show more</button>
                    </div>
                </section>

                <section class="movie-section">
                    <h2 class="category-best-movies-title">Best Action</h2>
                    <ul class="movies-container" id="best-action-movies">
                        <!-- feeded -->
                    </ul>
                    <div class="show-more-section">
                        <button class="show-more" aria-expanded="false" aria-controls="best-action-movies">Show more</button>
                    </div>
                </section>

                <section class="movie-section">
                    <div class="other-header">
                        <h2 class="category-best-movies-title">Others</h2>
                        <select id="other-genres">
                        <!-- feeded -->
                        </select>
                    </div>
                    
                    <ul class="movies-container" id="best-others-movies">
                        <!-- feeded -->
                    </ul>
                    <div class="show-more-section">
                        <button class="show-more" aria-expanded="false" aria-controls="best-others-movies">Show more</button>
                    </div>
                </section>
  
            </main>

            <footer>Author : KMB</footer>
        </div>

        <dialog id="detail-popup" class="detail-popup">
            <div class="popup-container">
                <button id="close-popup">Close</button>
                <div class="popup_top">
                    <div>
                        <div class="popup-header">                    
                            <div class="popup-detail-container">
                                <h2 id="popup-movie-title"></h2>
                                    <ul class="popup-movie-details">
                                        <li id="popup-year-genres"></li>
                                        <li id="popup-rated-duration"></li>
                                        <li id="popup-imdb-score"></li>
                                        <li id="popup-income"></li>
                                    </ul>
                                <h3>Directed by : 
                                </h3>
                                <p id="popup-directors"></p>
                            </div>                    
                        </div>
                        
                    </div>
                    <div class="popup-poster-container">
                        <img id="popup-poster" src="" alt="">
                    </div>
                </div>
                <div class="popup_bottom"> 
                    <div class="popup-body">
                            <p id="popup-long-description"></p>                    
                        </div>
                    Avec:
                    <p id="popup-actors"></p>
                </div>
            </div>
        </dialog>
    </body>    
</html>
