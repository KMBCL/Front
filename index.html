<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="static/style.css">
        <title>JustStreamIt</title>

        <script type="module" src="scripts/main.js"> </script>
    </head>

    <body>
        <div class="main-container">
            <header>
                <!-- nav en devenir: menu burger -->
                <div class="header-container">
                    <img class="jsi-logo" src="static/img/JSI-transparent-512.png" alt="">
                    <!-- <h1>Vidéo à la demande</h1> -->
                </div>
            </header>

            <main>
                
                <section class="best-movie-section" >
                    <!-- revoir classe section -->
                    <h2>Best Movie ever :</h2>
                    <div class="best-movie-container" id="best-movie">
                        <!-- feeded -->
                         <div class="best-movie-container__poster-container">
                            <img class="movie-poster" src="" alt="Movie Poster" id="best-movie-poster">
                         </div >
                         <div class="best-movie-container__details-container">
                            <h3 class="best-movie-container__details-container__h3" id="best-movie-title"></h3>
                            <p class="best-movie-container__details-container__p" id="best-movie-description"></p>
                            <button class="best-movie-container__details-container__details-button" id="best-movie-detail">Details</button>
                         </div>
                    </div>
                </section>

                <section class="movie-section">
                    <h2>Best movies</h2>
                    <ul class="movies-container" id="best-movies">
                        <!-- feeded -->
                    </ul>
                </section>

                <section class="movie-section">
                    <h2>Best Horror</h2>
                    <ul class="movies-container" id="best-horror-movies">
                        <!-- feeded -->
                    </ul>
                </section>

                <section class="movies-section">
                    <h2>Best Action</h2>
                    <ul class="movies-container" id="best-action-movies">
                        <!-- feeded -->
                    </ul>
                </section>

                <section class="movie-section">
                    <h2>Others</h2>
                    <label for="other-genres">Genres</label>
                    <select id="other-genres">
                        <!-- feeded -->
                    </select>
                    <ul class="movies-container" id="best-others-movies">
                        <!-- feeded -->
                    </ul>
                </section>
  
            </main>

            <footer>Author : KMB</footer>
        </div>

        <dialog id="detail-popup" class="detail-popup">
            <div class="popup-container">
                <button id="close-popup">Close</button>
                <div class="popup-header">                    
                    <div class="popup-detail-container">
                        <h2 id="popup-movie-title"></h2>
                            <ul class="popup-movie-details">
                                <li id="popup-year-genres"></li>
                                <li id="popup-rated-duration"></li>
                                <li id="popup-imdb-score"></li>
                                <li id="popup-income"></li>
                            </ul>
                        <h3>Directed by : 
                        </h3>
                        <p id="popup-directors"></p>
                    </div>                    
                </div>
                <div class="popup-body">
                    <p id="popup-long-description"></p>                    
                </div>
                <div class="popup-poster-container">
                    <img id="popup-poster" src="" alt="" class="movie-poster">
                </div>
                <div>
                    Avec:
                    <p id="popup-actors"></p>
                </div>
            </div>
        </dialog>
    </body>    
</html>
